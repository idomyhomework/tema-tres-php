# /etc/nginx/sites-available/seguro
# Actividad 3.17 — Alternativa NGINX: /seguro con auth_basic + HTTPS

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;   # fuerza HTTPS
}

server {
    listen 443 ssl;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /seguro {
        auth_basic           "Zona Segura";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # PHP dentro de /seguro: hereda auth_basic del location padre
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.1-fpm.sock;
            fastcgi_param REMOTE_USER $remote_user;
        }
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }
}
