# /etc/apache2/sites-available/seguro-ssl.conf
# Actividad 3.17 — Directorio /seguro/ con AuthType Digest y HTTPS (puerto 443)

# --- Puerto 80: todo se redirige a HTTPS ---
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    Redirect permanent /seguro/ https://localhost/seguro/
</VirtualHost>

# --- Puerto 443: TLS con certificado autofirmado ---
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
    # Con openssl (ver README) usarías en su lugar:
    # SSLCertificateFile    /etc/ssl/certs/seguro.crt
    # SSLCertificateKeyFile /etc/ssl/private/seguro.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    # Expone SSL_PROTOCOL, SSL_CIPHER... a PHP
    <FilesMatch "\.php$">
        SSLOptions +StdEnvVars
    </FilesMatch>

    # Control de acceso: Apache pide credenciales ANTES de ejecutar PHP
    <Directory /var/www/html/seguro>
        AuthType Digest
        AuthName "Zona Segura"
        AuthDigestProvider file
        AuthUserFile /etc/apache2/.htdigest
        Require valid-user
        Options -Indexes
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/seguro_error.log
    CustomLog ${APACHE_LOG_DIR}/seguro_access.log combined
</VirtualHost>
</IfModule>
